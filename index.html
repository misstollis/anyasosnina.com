<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Anya is updating her website right now. I mean, right now.">
  <title>Anya is updating her website</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf9f6; color: #272922; font-family: system-ui, sans-serif; text-align: center; }
    main { padding: 32px; max-width: 760px; }
    h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.15; font-weight: 500; letter-spacing: -1.5px; }
    p { color: #777a70; font-size: 20px; font-style: italic; }
    @media (prefers-reduced-motion: no-preference) {
      p { animation: reveal 700ms cubic-bezier(.2, .7, .2, 1) 900ms both; }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Anya is updating her website right now.</h1>
    <p>I mean, right now.</p>
  </main>
</body>
</html>
